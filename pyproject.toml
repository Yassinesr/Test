[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polyptail"
version = "0.1.0"
description = "POT-TC: extreme-value tail calibration for polyp segmentation, with the protocol infrastructure to test it honestly"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12",
    # Capped below 2.0: torch 2.0.1, the build recommended for a CUDA 11.4
    # driver, predates NumPy 2 C-API support. See requirements.txt.
    "numpy>=1.21,<2",
    "scipy>=1.7",
    "pillow>=9.0",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["polyptail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
