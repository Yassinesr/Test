# A6 -- label-noise robustness.  Bounds what any single (possibly
# mis-annotated) frame can contribute to the *gradient*: cap * tanh(e / cap),
# so the worst frame still pulls, with a slope that decays instead of
# switching off (cap_mode: hard restores the literal min(e, cap), which gives
# a capped frame no tail gradient at all).  The GPD is fitted to the uncapped
# pool: PWM already bounds one frame's influence on the fit at 1/n, and
# capping the sample squeezes it against the cap, drives xi to the clamp and
# inverts the weight profile.
#
# The card lists label-noise amplification as failure mode #1: the worst-loss
# images may simply be wrong. Read this together with per_image_deficits.csv,
# which names the training images that populated the tail -- if the same
# handful of stems dominate every epoch, inspect them before believing
# anything else in the table.
_base: a1_pottc.yaml

pot:
  tail:
    exceedance_cap: 0.3

run:
  name: a6_capped
  notes: "A6: A1 with the per-image exceedance capped at 0.3."
